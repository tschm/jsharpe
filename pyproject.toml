[project]
name = "jsharpe"
version = "0.6.3"
description = "Probabilistic Sharpe ratio and related statistics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Thomas Schmelzer", email = "thomas@jqr.ae" }
]

keywords = ["Sharpe ratio", "quant", "risk", "statistics"]
dependencies = [
    "numpy>=2.3.0",
    "scipy>=1.16.3",
]

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/tschm/jsharpe"
Homepage = "https://github.com/tschm/jsharpe"
Issues = "https://github.com/tschm/jsharpe/issues"

[dependency-groups]
dev = [
    "marimo==0.23.16",
    "cvxpy>=1.7.0",
    "jinja2>=3.1.6",
    "plotly>=6.5",
    "pandas>=2.3",
    "hypothesis>=6.112"
]
test = [
    "pytest>=8.0",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpversion]
# Authoritative list of every location this repo's own version is written.
# Kept in pyproject.toml because that is one of the four filenames
# bump-my-version auto-discovers (.bumpversion.toml, .bumpversion.cfg,
# setup.cfg, pyproject.toml). A block anywhere else is inert, and inert is
# silent: with no config found the tool falls back to `git describe` and can
# cut a release at a version that already exists. `current_version` is
# deliberately absent — bump-my-version reads [project].version natively, so
# duplicating it here only creates something that can go stale.
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]
allow_dirty = false
# The release flow commits and tags itself (so the changelog lands in the same
# commit as the bump), so bump-my-version must not do either.
commit = false
tag = false

[tool.bumpversion.parts.release]
optional_value = "prod"
values = ["dev", "alpha", "a", "beta", "b", "rc", "prod"]

# Anchored to the [project] table on purpose: an unanchored `version = "..."`
# search is applied to every occurrence in the file, so it would also rewrite
# any [tool.*] table that happens to share the current number.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'

# uv.lock is deliberately absent: its `name = "jsharpe"` entry is regenerated
# with `uv lock` after the bump. A search on the bare version string would also
# rewrite any dependency sitting at the same number.

# scipy ships no type stubs (scipy-stubs is a separate, partial package),
# so mypy --strict cannot resolve its imports. Ignore the missing stubs
# rather than pinning an out-of-tree stub package.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

