[project]
name = "jsharpe"
version = "0.6.3"
description = "Probabilistic Sharpe ratio and related statistics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Thomas Schmelzer", email = "thomas@jqr.ae" }
]

keywords = ["Sharpe ratio", "quant", "risk", "statistics"]
dependencies = [
    "numpy>=2.3.0",
    "scipy>=1.16.3",
]

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/tschm/jsharpe"
Homepage = "https://github.com/tschm/jsharpe"
Issues = "https://github.com/tschm/jsharpe/issues"

[dependency-groups]
dev = [
    "marimo==0.23.16",
    "cvxpy>=1.7.0",
    "jinja2>=3.1.6",
    "plotly>=6.5",
    "pandas>=2.3",
    "hypothesis>=6.112"
]
test = [
    "pytest>=8.0",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rhiza-task]
# Settings recovered from the make layer that rhiza v1.4.0 retired (`Makefile`,
# `.rhiza/rhiza.mk`, `.rhiza/make.d/*.mk`). The CLI's own defaults are NOT the values
# those files used, so anything omitted here silently changes behaviour. Every entry
# below records what the make layer set, what `rhiza-task` would default to, and what
# breaks without it. Verify with `uvx rhiza-task@0.3.1 print <setting>`.

# Was: `TYPECHECKER ?= both` (.rhiza/make.d/python.mk). CLI default: "ty".
# Without this the `typecheck` gate drops mypy entirely and runs ty alone. Note it also
# gets stricter than the make layer was: the old shell `case` let mypy's exit status win,
# so a ty failure could pass; rhiza-task requires both to succeed.
typechecker = "both"

# Was: `MKDOCS_EXTRA_PACKAGES = --with . --with 'mkdocstrings[python]'` (repo-owned
# Makefile). CLI default: ["mkdocstrings[python]"].
# Each entry becomes one `--with`. The `.` installs this package into the ephemeral uvx
# build env; jsharpe uses a src/ layout, so without it mkdocstrings cannot import
# `jsharpe` and `book` fails with ModuleNotFoundError. Naming this setting REPLACES the
# default list rather than extending it, so "mkdocstrings[python]" must be repeated here
# — dropping it would silently remove the plugin from the book build.
mkdocs-extra-packages = [".", "mkdocstrings[python]"]

# Was: `RHIZA_CHECKS_VERSION ?= 0.2.1`, used as `--with 'pytest-rhiza==$(...)'`
# (.rhiza/make.d/quality.mk). CLI default: the git pin
# "pytest-rhiza @ git+https://github.com/Jebel-Quant/pytest-rhiza@v0.2.0".
# Preserving the repo's pin keeps `rhiza-test` running the same assertion set as before
# the migration; the CLI default would silently move it back to v0.2.0.
pytest-rhiza = "pytest-rhiza==0.2.1"

# NOT a migrated value — a fix. The make layer and the deleted `.rhiza/.env` both said
# `docs/notebooks`, which is also the CLI default, but this repo keeps its notebooks in
# `book/marimo/notebooks`. `rhiza_marimo.yml` reads `print marimo_folder` and searches it
# with `find -maxdepth 1`, so the gate found no directory, set an empty matrix and passed
# green while executing ZERO notebooks. Pointing it at the real folder makes the gate run
# `psr.py` (verified passing locally). Keep this in step with the notebooks' location.
marimo-folder = "book/marimo/notebooks"

# Deliberately not set — each matches the CLI default, so naming it would only create a
# second place to keep in sync:
#   source-folder        "src"                  (.rhiza/rhiza.mk, and the deleted .env)
#   coverage-fail-under  90                     (.rhiza/make.d/python.mk; this repo has no
#                                                [tool.coverage.report] fail-under either)
#   tests-folder         "tests"                (.rhiza/make.d/python.mk)
#   license-fail-on      GPL;LGPL;AGPL          (.rhiza/make.d/python.mk)
#   uv-sync-args         --all-extras --all-groups
#   zensical-version     >=0.0.36               (.rhiza/make.d/book.mk)
#   book-output          "_book"                (.rhiza/make.d/book.mk)
#   layers               python                 (inferred from the manifest)
#   rhiza-checks         all five modules the make layer's `+=` lines accumulated
#
# ci-os-matrix is deliberately absent, not merely default. `.rhiza/.env` carried a comment
# explaining that pinning it here defeats `rhiza_ci.yml`'s per-caller export (rhiza #1545):
# the workflow chooses the matrix per consumer, and a value in this file would override it
# for every run. Leave it unset unless this repo genuinely needs more platforms.
#
# license-ignore-packages is also deliberately absent. `.rhiza/make.d/marimo.mk` appended
# `docutils`, which reports a GPL classifier and would fail the copyleft scan — but
# rhiza-task appends it itself when marimo is in the task registry. Verified: `license`
# passes with this setting unset.

[tool.bumpversion]
# Authoritative list of every location this repo's own version is written.
# Kept in pyproject.toml because that is one of the four filenames
# bump-my-version auto-discovers (.bumpversion.toml, .bumpversion.cfg,
# setup.cfg, pyproject.toml). A block anywhere else is inert, and inert is
# silent: with no config found the tool falls back to `git describe` and can
# cut a release at a version that already exists. `current_version` is
# deliberately absent — bump-my-version reads [project].version natively, so
# duplicating it here only creates something that can go stale.
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]
allow_dirty = false
# The release flow commits and tags itself (so the changelog lands in the same
# commit as the bump), so bump-my-version must not do either.
commit = false
tag = false

[tool.bumpversion.parts.release]
optional_value = "prod"
values = ["dev", "alpha", "a", "beta", "b", "rc", "prod"]

# Anchored to the [project] table on purpose: an unanchored `version = "..."`
# search is applied to every occurrence in the file, so it would also rewrite
# any [tool.*] table that happens to share the current number.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'

# uv.lock is deliberately absent: its `name = "jsharpe"` entry is regenerated
# with `uv lock` after the bump. A search on the bare version string would also
# rewrite any dependency sitting at the same number.

# scipy ships no type stubs (scipy-stubs is a separate, partial package),
# so mypy --strict cannot resolve its imports. Ignore the missing stubs
# rather than pinning an out-of-tree stub package.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

